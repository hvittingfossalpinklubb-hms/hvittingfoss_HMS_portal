    <!-- Main Application Script (Firebase SDK v10+ via CDN, ingen innlogging påkrevd) -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
      import {
        getAuth,
        onAuthStateChanged,
        signInAnonymously,
        signInWithEmailAndPassword,
      } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
      import {
        getFirestore,
        collection,
        doc,
        setDoc,
        addDoc,
        updateDoc,
        deleteDoc,
        onSnapshot,
        writeBatch,
      } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

      // ------------------------------------------------------------------
      // 1. Firebase Configuration & Initialization
      // ------------------------------------------------------------------
      const firebaseConfig = {
        apiKey: "AIzaSyAWeWaeXIUO4sCOSmuCFMxiM_aEufmajBs",
        authDomain: "risikoanalyse-c5838.firebaseapp.com",
        projectId: "risikoanalyse-c5838",
        storageBucket: "risikoanalyse-c5838.firebasestorage.app",
        messagingSenderId: "185947039818",
        appId: "1:185947039818:web:cc91020246c94b304f5eb3"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // ------------------------------------------------------------------
      // 2. Constants & Domain Logic (Hvittingsfoss Alpinklubb Risk Matrix)
      // ------------------------------------------------------------------
      const CURRENT_YEAR = new Date().getFullYear();
      const GEMINI_KEY_STORAGE = 'hak_gemini_api_key';

      const STATUS_OPTIONS = ['Ikke startet', 'Pågår', 'Utført / Kontrollert'];

      const PROBABILITY_LABELS = {
        1: '1 · Svært liten',
        2: '2 · Liten',
        3: '3 · Middels',
        4: '4 · Stor',
        5: '5 · Svært stor',
      };

      const CONSEQUENCE_LABELS = {
        1: '1 · Ubetydelig',
        2: '2 · Mindre',
        3: '3 · Moderat',
        4: '4 · Alvorlig',
        5: '5 · Svært alvorlig',
      };

      function clampRating(value, fallback = 1) {
        const num = parseInt(value, 10);
        if (Number.isNaN(num)) return fallback;
        return Math.min(5, Math.max(1, num));
      }

      function computeRisk(s, k) {
        const prob = clampRating(s, 1);
        const cons = clampRating(k, 1);
        return prob * cons;
      }

      function getRiskMeta(score) {
        const num = Number(score) || 0;
        if (num >= 16) {
          return {
            level: 'Høy',
            key: 'high',
            bgClass: 'bg-red-50 text-red-800 border-red-200',
            printBg: '#FEF2F2',
            printText: '#991B1B',
            dotClass: 'bg-red-600',
            range: '16–25',
          };
        }
        if (num >= 6) {
          return {
            level: 'Middels',
            key: 'medium',
            bgClass: 'bg-amber-50 text-amber-800 border-amber-200',
            printBg: '#FFFBEB',
            printText: '#92400E',
            dotClass: 'bg-amber-500',
            range: '6–15',
          };
        }
        return {
          level: 'Lav',
          key: 'low',
          bgClass: 'bg-emerald-50 text-emerald-800 border-emerald-200',
          printBg: '#ECFDF5',
          printText: '#065F46',
          dotClass: 'bg-emerald-600',
          range: '1–5',
        };
      }

      function naturalSortNr(a, b) {
        const nrA = String(a?.nr ?? '').trim();
        const nrB = String(b?.nr ?? '').trim();
        return nrA.localeCompare(nrB, 'nb', { numeric: true, sensitivity: 'base' });
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function makeDocId(year, rammeverkId, nr) {
        const safeRef = String(rammeverkId || nr || 'item')
          .trim()
          .replace(/[^a-zA-Z0-9_-]/g, '_');
        return `${year}_${safeRef}`;
      }

      function formatDateTimeNo(isoString) {
        if (!isoString) return 'Ikke registrert';
        try {
          return new Intl.DateTimeFormat('nb-NO', {
            dateStyle: 'medium',
            timeStyle: 'short',
          }).format(new Date(isoString));
        } catch {
          return isoString;
        }
      }

      // ------------------------------------------------------------------
      // 3. Application State
      // ------------------------------------------------------------------
      const state = {
        activeTab: 'dashboard', // 'dashboard' | 'wizard' | 'framework' | 'reporting'
        selectedYear: CURRENT_YEAR,
        wizardYear: CURRENT_YEAR,
        reportYear: CURRENT_YEAR,

        rammeverk: [],
        vurderinger: [],
        dataLoading: true,
        dataError: '',
        permissionDenied: false,
        showOptionalAuthForm: false,
        optionalAuthSubmitting: false,
        optionalAuthError: '',

        // Dashboard filters
        searchQuery: '',
        riskFilter: 'all', // 'all' | 'high' | 'medium' | 'low'
        statusFilter: 'all', // 'all' | 'Ikke startet' | 'Pågår' | 'Utført / Kontrollert' | 'missing'

        // Wizard state
        wizardSelectedIndex: 0,
        wizardDraft: null,
        wizardSaving: false,
        aiSuggesting: false,

        // Framework & Excel Import state
        frameworkSearch: '',
        importPreview: null, // { sheetName, headerRowNumber, rows, fileName }
        importIncludeHistory: true,
        importHistoryYear: 2025,
        importing: false,
        importError: '',

        // Modal / Drawer state
        editingAssessmentId: null, // vurdering docId
        editingAssessmentDraft: null,
        editingFrameworkItem: null, // null | { isNew, ... }

        // Local Gemini API key
        geminiKey: localStorage.getItem(GEMINI_KEY_STORAGE) || '',
        geminiKeyVisible: false,

        // Active Firestore unsubscribers
        unsubRammeverk: null,
        unsubVurderinger: null,
      };

      // ------------------------------------------------------------------
      // 4. Toast Notification Helper
      // ------------------------------------------------------------------
      function showToast(message, type = 'success') {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const el = document.createElement('div');
        const palette =
          type === 'error'
            ? 'bg-red-900 text-white border-red-800'
            : type === 'info'
            ? 'bg-slate-900 text-white border-slate-800'
            : 'bg-emerald-800 text-white border-emerald-700';

        el.className = `pointer-events-auto flex items-center gap-2.5 rounded-lg border px-4 py-2.5 text-sm font-medium shadow-lg transition-all duration-200 ${palette}`;
        el.innerHTML = `<span>${escapeHtml(message)}</span>`;
        root.appendChild(el);

        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(6px)';
          setTimeout(() => el.remove(), 220);
        }, 3200);
      }

      // ------------------------------------------------------------------
      // 5. Data Helpers & Derived Lists
      // ------------------------------------------------------------------
      function getAvailableYears() {
        const years = new Set([2025, 2026, CURRENT_YEAR, CURRENT_YEAR + 1]);
        state.vurderinger.forEach((v) => {
          const y = parseInt(v.arstall, 10);
          if (!Number.isNaN(y) && y >= 2000 && y <= 2100) {
            years.add(y);
          }
        });
        years.add(Number(state.selectedYear));
        years.add(Number(state.wizardYear));
        years.add(Number(state.reportYear));
        return Array.from(years).sort((a, b) => b - a);
      }

      function getAssessmentsForYear(year) {
        const targetYear = Number(year);
        return state.vurderinger
          .filter((v) => Number(v.arstall) === targetYear)
          .sort(naturalSortNr);
      }

      function findAssessmentForCheckpoint(year, rammeverkItem) {
        const targetYear = Number(year);
        return state.vurderinger.find(
          (v) =>
            Number(v.arstall) === targetYear &&
            ((v.rammeverkId && v.rammeverkId === rammeverkItem.id) ||
              (String(v.nr ?? '').trim() !== '' &&
                String(v.nr).trim() === String(rammeverkItem.nr ?? '').trim()))
        );
      }

      function buildWizardDraft(item, year) {
        if (!item) return null;
        const existing = findAssessmentForCheckpoint(year, item);
        if (existing) {
          return {
            id: existing.id,
            rammeverkId: item.id,
            nr: item.nr,
            komponentSted: item.komponentSted,
            farer: item.farer,
            muligeArsaker: item.muligeArsaker,
            typeSkade: item.typeSkade,
            innledendeSannsynlighet: clampRating(existing.innledendeSannsynlighet, 2),
            innledendeKonsekvens: clampRating(existing.innledendeKonsekvens, 3),
            tiltak: existing.tiltak ?? item.standardTiltak ?? '',
            restSannsynlighet: clampRating(existing.restSannsynlighet, 1),
            restKonsekvens: clampRating(existing.restKonsekvens, 2),
            ansvarlig: existing.ansvarlig ?? item.standardAnsvarlig ?? '',
            status: existing.status ?? 'Ikke startet',
            merknad: existing.merknad ?? '',
            isSaved: true,
          };
        }

        const initS = clampRating(item.standardSannsynlighet, 2);
        const initK = clampRating(item.standardKonsekvens, 3);
        const restS = clampRating(item.standardRestSannsynlighet, 1);
        const restK = clampRating(item.standardRestKonsekvens, Math.min(initK, 3));

        return {
          id: makeDocId(year, item.id, item.nr),
          rammeverkId: item.id,
          nr: item.nr,
          komponentSted: item.komponentSted,
          farer: item.farer,
          muligeArsaker: item.muligeArsaker,
          typeSkade: item.typeSkade,
          innledendeSannsynlighet: initS,
          innledendeKonsekvens: initK,
          tiltak: item.standardTiltak ?? '',
          restSannsynlighet: restS,
          restKonsekvens: restK,
          ansvarlig: item.standardAnsvarlig ?? '',
          status: 'Ikke startet',
          merknad: '',
          isSaved: false,
        };
      }

      function syncWizardDraft(preserveDirty = false) {
        if (state.rammeverk.length === 0) {
          state.wizardDraft = null;
          return;
        }
        if (state.wizardSelectedIndex >= state.rammeverk.length) {
          state.wizardSelectedIndex = 0;
        }
        const item = state.rammeverk[state.wizardSelectedIndex];
        if (
          preserveDirty &&
          state.wizardDraft &&
          state.wizardDraft.rammeverkId === item.id
        ) {
          return;
        }
        state.wizardDraft = buildWizardDraft(item, state.wizardYear);
      }

      // ------------------------------------------------------------------
      // 6. Firestore Subscriptions & Mutations
      // ------------------------------------------------------------------
      function stopFirestoreListeners() {
        if (typeof state.unsubRammeverk === 'function') {
          state.unsubRammeverk();
          state.unsubRammeverk = null;
        }
        if (typeof state.unsubVurderinger === 'function') {
          state.unsubVurderinger();
          state.unsubVurderinger = null;
        }
      }

      function startFirestoreListeners() {
        stopFirestoreListeners();
        state.dataLoading = true;
        state.dataError = '';
        state.permissionDenied = false;

        let rammeverkLoaded = false;
        let vurderingerLoaded = false;

        const finishCheck = () => {
          if (rammeverkLoaded && vurderingerLoaded) {
            state.dataLoading = false;
            state.permissionDenied = false;
            state.dataError = '';
            syncWizardDraft(true);
            render();
          }
        };

        state.unsubRammeverk = onSnapshot(
          collection(db, 'rammeverk'),
          (snapshot) => {
            const list = snapshot.docs.map((d) => ({
              id: d.id,
              ...d.data(),
            }));
            list.sort(naturalSortNr);
            state.rammeverk = list;
            rammeverkLoaded = true;
            syncWizardDraft(true);
            finishCheck();
            if (!state.dataLoading) render();
          },
          (err) => {
            console.warn('Firestore rammeverk error:', err);
            if (err?.code === 'permission-denied') {
              state.permissionDenied = true;
            }
            state.dataError = translateFirestoreError(err);
            state.dataLoading = false;
            render();
          }
        );

        state.unsubVurderinger = onSnapshot(
          collection(db, 'vurderinger'),
          (snapshot) => {
            const list = snapshot.docs.map((d) => ({
              id: d.id,
              ...d.data(),
            }));
            list.sort(naturalSortNr);
            state.vurderinger = list;
            vurderingerLoaded = true;
            finishCheck();
            if (!state.dataLoading) render();
          },
          (err) => {
            console.warn('Firestore vurderinger error:', err);
            if (err?.code === 'permission-denied') {
              state.permissionDenied = true;
            }
            state.dataError = translateFirestoreError(err);
            state.dataLoading = false;
            render();
          }
        );
      }

      function translateFirestoreError(err) {
        const code = err?.code || '';
        if (code === 'permission-denied') {
          return 'Firestore i prosjektet «risikoanalyse-c5838» blokkerer tilgang uten gyldig autorisasjon (Missing or insufficient permissions).';
        }
        if (code === 'unavailable') {
          return 'Kan ikke kontakte Firestore akkurat nå. Sjekk internettforbindelsen.';
        }
        return `Databasefeil: ${err?.message || 'Ukjent feil'}`;
      }

      async function saveAssessmentStatus(docId, newStatus) {
        try {
          await updateDoc(doc(db, 'vurderinger', docId), {
            status: newStatus,
            updatedAt: new Date().toISOString(),
          });
          showToast(`Status oppdatert til «${newStatus || 'Ikke satt'}»`);
        } catch (err) {
          console.error(err);
          showToast(translateFirestoreError(err), 'error');
        }
      }

      async function saveAssessmentRecord(payload, docId) {
        const innledendeRisikotall = computeRisk(
          payload.innledendeSannsynlighet,
          payload.innledendeKonsekvens
        );
        const restRisikotall = computeRisk(
          payload.restSannsynlighet,
          payload.restKonsekvens
        );

        const dataToSave = {
          arstall: Number(payload.arstall),
          rammeverkId: payload.rammeverkId || '',
          nr: String(payload.nr ?? '').trim(),
          komponentSted: String(payload.komponentSted ?? '').trim(),
          farer: String(payload.farer ?? '').trim(),
          muligeArsaker: String(payload.muligeArsaker ?? '').trim(),
          typeSkade: String(payload.typeSkade ?? '').trim(),
          innledendeSannsynlighet: clampRating(payload.innledendeSannsynlighet, 1),
          innledendeKonsekvens: clampRating(payload.innledendeKonsekvens, 1),
          innledendeRisikotall,
          tiltak: String(payload.tiltak ?? '').trim(),
          restSannsynlighet: clampRating(payload.restSannsynlighet, 1),
          restKonsekvens: clampRating(payload.restKonsekvens, 1),
          restRisikotall,
          ansvarlig: String(payload.ansvarlig ?? '').trim(),
          status: payload.status ?? 'Ikke startet',
          merknad: String(payload.merknad ?? '').trim(),
          updatedAt: new Date().toISOString(),
        };

        await setDoc(doc(db, 'vurderinger', docId), dataToSave, { merge: true });
      }

      async function saveFrameworkItem(itemData, existingId) {
        const cleanData = {
          nr: String(itemData.nr ?? '').trim(),
          komponentSted: String(itemData.komponentSted ?? '').trim(),
          farer: String(itemData.farer ?? '').trim(),
          muligeArsaker: String(itemData.muligeArsaker ?? '').trim(),
          typeSkade: String(itemData.typeSkade ?? '').trim(),
          standardSannsynlighet: clampRating(itemData.standardSannsynlighet, 2),
          standardKonsekvens: clampRating(itemData.standardKonsekvens, 3),
          standardTiltak: String(itemData.standardTiltak ?? '').trim(),
          standardAnsvarlig: String(itemData.standardAnsvarlig ?? '').trim(),
          updatedAt: new Date().toISOString(),
        };

        if (existingId) {
          await setDoc(doc(db, 'rammeverk', existingId), cleanData, { merge: true });
        } else {
          await addDoc(collection(db, 'rammeverk'), cleanData);
        }
      }

      async function deleteFrameworkItem(id) {
        await deleteDoc(doc(db, 'rammeverk', id));
      }

      // ------------------------------------------------------------------
      // 7. Gemini AI Measure Suggestion (Optional Local Key)
      // ------------------------------------------------------------------
      async function requestGeminiSuggestion(context) {
        const apiKey = (state.geminiKey || '').trim();
        if (!apiKey) {
          showToast(
            'Legg inn en Gemini API-nøkkel under «Rapportering» for å bruke KI-forslag.',
            'info'
          );
          return null;
        }

        const prompt = [
          'Du er HMS- og sikkerhetsrådgiver for et norsk alpinanlegg (Hvittingsfoss Alpinklubb).',
          'Foreslå 3 til 5 konkrete, praktiske og handlingsrettede risikoreduserende tiltak på norsk (bokmål) basert på følgende risikopunkt:',
          `- Nr: ${context.nr || '-'}`,
          `- Komponent/Sted: ${context.komponentSted || '-'}`,
          `- Farer: ${context.farer || '-'}`,
          `- Mulige årsaker: ${context.muligeArsaker || '-'}`,
          `- Type skade/hendelse: ${context.typeSkade || '-'}`,
          'Svar kortfattet med punktliste uten innledning eller avslutning.',
        ].join('\n');

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(
          apiKey
        )}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
          }),
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`Gemini API svarte med feil (${response.status}): ${errText}`);
        }

        const data = await response.json();
        const text =
          data?.candidates?.[0]?.content?.parts
            ?.map((p) => p.text || '')
            .join('\n')
            .trim() || '';

        if (!text) {
          throw new Error('Ingen tekst returnert fra Gemini.');
        }
        return text;
      }

      // ------------------------------------------------------------------
      // 8. Excel / CSV Parsing (Finds row starting with "Nr." automatically)
      // ------------------------------------------------------------------
      function normalizeHeader(str) {
        return String(str ?? '')
          .trim()
          .toLowerCase()
          .replace(/\s+/g, ' ');
      }

      function parseExcelWorksheet(workbook, preferredSheetName = null) {
        if (!workbook || !workbook.SheetNames?.length) {
          throw new Error('Filen inneholder ingen regneark.');
        }

        const sheetName =
          preferredSheetName && workbook.SheetNames.includes(preferredSheetName)
            ? preferredSheetName
            : workbook.SheetNames[0];

        const sheet = workbook.Sheets[sheetName];
        const matrix = XLSX.utils.sheet_to_json(sheet, {
          header: 1,
          defval: '',
          blankrows: false,
        });

        let headerIdx = -1;
        let nrColOffset = 0;

        for (let r = 0; r < matrix.length; r++) {
          const row = matrix[r];
          if (!Array.isArray(row)) continue;

          for (let c = 0; c < Math.min(row.length, 3); c++) {
            const cell = String(row[c] ?? '').trim();
            const lower = cell.toLowerCase();
            if (lower === 'nr.' || lower === 'nr' || /^nr\.?\s*$/i.test(cell)) {
              const joined = row.map((x) => String(x ?? '').toLowerCase()).join(' ');
              if (
                joined.includes('komponent') ||
                joined.includes('sted') ||
                joined.includes('fare') ||
                joined.includes('årsak') ||
                joined.includes('tiltak')
              ) {
                headerIdx = r;
                nrColOffset = c;
                break;
              }
            }
          }
          if (headerIdx !== -1) break;
        }

        if (headerIdx === -1) {
          for (let r = 0; r < matrix.length; r++) {
            const row = matrix[r];
            if (!Array.isArray(row)) continue;
            const firstCell = String(row[0] ?? '').trim().toLowerCase();
            if (firstCell.startsWith('nr.')) {
              headerIdx = r;
              nrColOffset = 0;
              break;
            }
          }
        }

        if (headerIdx === -1) {
          throw new Error(
            'Fant ingen kolonneoverskrift som starter med «Nr.» i arket. Kontroller at Excel-filen følger klubbens mal.'
          );
        }

        const headerRow = matrix[headerIdx];

        const cols = {
          nr: nrColOffset,
          komponentSted: -1,
          farer: -1,
          muligeArsaker: -1,
          typeSkade: -1,
          initS: -1,
          initK: -1,
          initR: -1,
          tiltak: -1,
          restS: -1,
          restK: -1,
          restR: -1,
          ansvarlig: -1,
          status: -1,
        };

        let seenTiltak = false;
        for (let c = nrColOffset; c < headerRow.length; c++) {
          const h = normalizeHeader(headerRow[c]);
          if (!h) continue;

          if ((h === 'nr.' || h === 'nr') && cols.nr === nrColOffset) {
            cols.nr = c;
          } else if (
            cols.komponentSted === -1 &&
            (h.includes('komponent') || h.includes('sted') || h.includes('område'))
          ) {
            cols.komponentSted = c;
          } else if (cols.farer === -1 && h.includes('fare')) {
            cols.farer = c;
          } else if (cols.muligeArsaker === -1 && (h.includes('årsak') || h.includes('arsak'))) {
            cols.muligeArsaker = c;
          } else if (
            cols.typeSkade === -1 &&
            (h.includes('skade') || h.includes('hendelse'))
          ) {
            cols.typeSkade = c;
          } else if (
            h.includes('tiltak') ||
            h.includes('eliminering') ||
            h.includes('korrigerende')
          ) {
            cols.tiltak = c;
            seenTiltak = true;
          } else if (h.includes('sannsyn')) {
            if (!seenTiltak && cols.initS === -1) {
              cols.initS = c;
            } else if (cols.restS === -1) {
              cols.restS = c;
            }
          } else if (h.includes('konsekvens')) {
            if (!seenTiltak && cols.initK === -1) {
              cols.initK = c;
            } else if (cols.restK === -1) {
              cols.restK = c;
            }
          } else if (h.includes('risikotall') || h === 'risiko') {
            if (!seenTiltak && cols.initR === -1) {
              cols.initR = c;
            } else if (cols.restR === -1) {
              cols.restR = c;
            }
          } else if (cols.ansvarlig === -1 && h.includes('ansvar')) {
            cols.ansvarlig = c;
          } else if (cols.status === -1 && h.includes('status')) {
            cols.status = c;
          }
        }

        const parsedRows = [];
        for (let r = headerIdx + 1; r < matrix.length; r++) {
          const row = matrix[r];
          if (!Array.isArray(row)) continue;

          const nrVal = String(row[cols.nr] ?? '').trim();
          const compVal =
            cols.komponentSted !== -1 ? String(row[cols.komponentSted] ?? '').trim() : '';
          const fareVal = cols.farer !== -1 ? String(row[cols.farer] ?? '').trim() : '';

          if (!nrVal && !compVal && !fareVal) continue;
          if (!nrVal && compVal && !fareVal) continue;

          const initS = cols.initS !== -1 ? parseInt(row[cols.initS], 10) : NaN;
          const initK = cols.initK !== -1 ? parseInt(row[cols.initK], 10) : NaN;
          const restS = cols.restS !== -1 ? parseInt(row[cols.restS], 10) : NaN;
          const restK = cols.restK !== -1 ? parseInt(row[cols.restK], 10) : NaN;

          const rawStatus =
            cols.status !== -1 ? String(row[cols.status] ?? '').trim() : '';
          const normalizedStatus = STATUS_OPTIONS.includes(rawStatus)
            ? rawStatus
            : rawStatus.toLowerCase().includes('utført') ||
              rawStatus.toLowerCase().includes('kontrollert')
            ? 'Utført / Kontrollert'
            : rawStatus.toLowerCase().includes('pågår')
            ? 'Pågår'
            : rawStatus.toLowerCase().includes('ikke')
            ? 'Ikke startet'
            : '';

          parsedRows.push({
            nr: nrVal || String(parsedRows.length + 1),
            komponentSted: compVal,
            farer: fareVal,
            muligeArsaker:
              cols.muligeArsaker !== -1 ? String(row[cols.muligeArsaker] ?? '').trim() : '',
            typeSkade:
              cols.typeSkade !== -1 ? String(row[cols.typeSkade] ?? '').trim() : '',
            innledendeSannsynlighet: Number.isNaN(initS) ? 2 : clampRating(initS, 2),
            innledendeKonsekvens: Number.isNaN(initK) ? 3 : clampRating(initK, 3),
            hasInitialRatings: !Number.isNaN(initS) && !Number.isNaN(initK),
            tiltak: cols.tiltak !== -1 ? String(row[cols.tiltak] ?? '').trim() : '',
            restSannsynlighet: Number.isNaN(restS) ? 1 : clampRating(restS, 1),
            restKonsekvens: Number.isNaN(restK) ? 2 : clampRating(restK, 2),
            hasRestRatings: !Number.isNaN(restS) && !Number.isNaN(restK),
            ansvarlig:
              cols.ansvarlig !== -1 ? String(row[cols.ansvarlig] ?? '').trim() : '',
            status: normalizedStatus,
          });
        }

        if (parsedRows.length === 0) {
          throw new Error(
            `Fant overskriftsrad på rad ${headerIdx + 1}, men ingen datapunkter under denne.`
          );
        }

        return {
          sheetName,
          sheetNames: workbook.SheetNames,
          headerRowNumber: headerIdx + 1,
          rows: parsedRows,
        };
      }

      async function commitExcelImport() {
        const preview = state.importPreview;
        if (!preview || !preview.rows.length) return;

        state.importing = true;
        state.importError = '';
        render();

        try {
          const existingByNr = new Map();
          state.rammeverk.forEach((item) => {
            const key = String(item.nr ?? '').trim().toLowerCase();
            if (key) existingByNr.set(key, item);
          });

          const ops = [];
          const now = new Date().toISOString();
          const historyYear = parseInt(state.importHistoryYear, 10) || 2025;

          preview.rows.forEach((row) => {
            const nrKey = String(row.nr ?? '').trim().toLowerCase();
            const existing = existingByNr.get(nrKey);
            const rammeverkDocRef = existing
              ? doc(db, 'rammeverk', existing.id)
              : doc(collection(db, 'rammeverk'));

            ops.push({
              ref: rammeverkDocRef,
              data: {
                nr: row.nr,
                komponentSted: row.komponentSted,
                farer: row.farer,
                muligeArsaker: row.muligeArsaker,
                typeSkade: row.typeSkade,
                standardSannsynlighet: row.innledendeSannsynlighet,
                standardKonsekvens: row.innledendeKonsekvens,
                standardRestSannsynlighet: row.restSannsynlighet,
                standardRestKonsekvens: row.restKonsekvens,
                standardTiltak: row.tiltak,
                standardAnsvarlig: row.ansvarlig,
                updatedAt: now,
              },
            });

            if (state.importIncludeHistory) {
              const vurderingId = makeDocId(historyYear, rammeverkDocRef.id, row.nr);
              const vurderingRef = doc(db, 'vurderinger', vurderingId);
              const initR = computeRisk(
                row.innledendeSannsynlighet,
                row.innledendeKonsekvens
              );
              const restR = computeRisk(row.restSannsynlighet, row.restKonsekvens);
              ops.push({
                ref: vurderingRef,
                data: {
                  arstall: historyYear,
                  rammeverkId: rammeverkDocRef.id,
                  nr: row.nr,
                  komponentSted: row.komponentSted,
                  farer: row.farer,
                  muligeArsaker: row.muligeArsaker,
                  typeSkade: row.typeSkade,
                  innledendeSannsynlighet: row.innledendeSannsynlighet,
                  innledendeKonsekvens: row.innledendeKonsekvens,
                  innledendeRisikotall: initR,
                  tiltak: row.tiltak,
                  restSannsynlighet: row.restSannsynlighet,
                  restKonsekvens: row.restKonsekvens,
                  restRisikotall: restR,
                  ansvarlig: row.ansvarlig,
                  status: row.status || 'Ikke startet',
                  merknad: '',
                  updatedAt: now,
                },
              });
            }
          });

          const CHUNK_SIZE = 400;
          for (let i = 0; i < ops.length; i += CHUNK_SIZE) {
            const batch = writeBatch(db);
            ops.slice(i, i + CHUNK_SIZE).forEach((op) => {
              batch.set(op.ref, op.data, { merge: true });
            });
            await batch.commit();
          }

          const importedCount = preview.rows.length;
          state.importPreview = null;
          if (state.importIncludeHistory) {
            state.selectedYear = historyYear;
            state.reportYear = historyYear;
          }
          showToast(
            state.importIncludeHistory
              ? `Importerte ${importedCount} punkter til rammeverk og historikk for ${historyYear}.`
              : `Importerte ${importedCount} punkter til rammeverket.`
          );
        } catch (err) {
          console.error('Import commit error:', err);
          state.importError = translateFirestoreError(err);
          showToast('Feil under lagring til databasen.', 'error');
        } finally {
          state.importing = false;
          render();
        }
      }

      function exportYearAssessments(year, format = 'xlsx') {
        const rows = getAssessmentsForYear(year);
        if (!rows.length) {
          showToast(`Ingen vurderinger å eksportere for ${year}.`, 'info');
          return;
        }

        const headerTitle = [
          [`Hvittingsfoss Alpinklubb – Risikoanalyse & SJA ${year}`],
          [
            `Eksportert: ${new Intl.DateTimeFormat('nb-NO', {
              dateStyle: 'long',
              timeStyle: 'short',
            }).format(new Date())}`,
          ],
          ['Risikomatrise: 1–5 Lav (Grønn) | 6–15 Middels (Gul/Oransje) | 16–25 Høy (Rød)'],
          [],
        ];

        const colHeaders = [
          'Nr.',
          'Komponent/Sted',
          'Farer',
          'Mulige årsaker',
          'Type skade/hendelse',
          'Sannsynlighet',
          'Konsekvens',
          'Risikotall',
          'Iverksatte tiltak for eliminering av risiko',
          'Restrisiko Sannsynlighet',
          'Restrisiko Konsekvens',
          'Restrisikotall',
          'Risikonivå (Restrisiko)',
          'Ansvarlig for oppfyllelse av krav',
          'Status',
        ];

        const dataRows = rows.map((r) => {
          const restScore = r.restRisikotall ?? computeRisk(r.restSannsynlighet, r.restKonsekvens);
          const initScore =
            r.innledendeRisikotall ??
            computeRisk(r.innledendeSannsynlighet, r.innledendeKonsekvens);
          return [
            r.nr ?? '',
            r.komponentSted ?? '',
            r.farer ?? '',
            r.muligeArsaker ?? '',
            r.typeSkade ?? '',
            r.innledendeSannsynlighet ?? '',
            r.innledendeKonsekvens ?? '',
            initScore,
            r.tiltak ?? '',
            r.restSannsynlighet ?? '',
            r.restKonsekvens ?? '',
            restScore,
            getRiskMeta(restScore).level,
            r.ansvarlig ?? '',
            r.status || 'Ikke startet',
          ];
        });

        const wsData = [...headerTitle, colHeaders, ...dataRows];
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        ws['!cols'] = [
          { wch: 8 },
          { wch: 24 },
          { wch: 30 },
          { wch: 26 },
          { wch: 24 },
          { wch: 13 },
          { wch: 12 },
          { wch: 11 },
          { wch: 42 },
          { wch: 18 },
          { wch: 18 },
          { wch: 14 },
          { wch: 18 },
          { wch: 22 },
          { wch: 18 },
        ];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, `Risikovurdering ${year}`);

        if (format === 'csv') {
          XLSX.writeFile(wb, `Hvittingsfoss_Alpinklubb_Risikovurdering_${year}.csv`, {
            bookType: 'csv',
          });
          showToast(`Lastet ned CSV for ${year}.`);
        } else {
          XLSX.writeFile(wb, `Hvittingsfoss_Alpinklubb_Risikovurdering_${year}.xlsx`);
          showToast(`Lastet ned Excel-fil for ${year}.`);
        }
      }

              <div class="p-4 border-b border-slate-200 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                <div class="relative flex-1 max-w-md">
                  <svg
                    class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z" />
                  </svg>
                  <input
                    id="dashboard-search-input"
                    type="search"
                    value="${escapeHtml(state.searchQuery)}"
                    placeholder="Søk på nr., sted, fare, tiltak eller ansvarlig…"
                    class="w-full rounded-lg border border-slate-300 bg-white pl-9 pr-3.5 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                  />
                </div>

                <div class="flex flex-wrap items-center gap-2.5">
                  <select
                    id="dashboard-risk-filter"
                    aria-label="Filtrer på restrisiko"
                    class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                  >
                    <option value="all" ${state.riskFilter === 'all' ? 'selected' : ''}>Alle risikonivåer</option>
                    <option value="high" ${state.riskFilter === 'high' ? 'selected' : ''}>Høy (16–25)</option>
                    <option value="medium" ${state.riskFilter === 'medium' ? 'selected' : ''}>Middels (6–15)</option>
                    <option value="low" ${state.riskFilter === 'low' ? 'selected' : ''}>Lav (1–5)</option>
                  </select>

                  <select
                    id="dashboard-status-filter"
                    aria-label="Filtrer på status"
                    class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                  >
                    <option value="all" ${state.statusFilter === 'all' ? 'selected' : ''}>Alle statuser</option>
                    <option value="Ikke startet" ${state.statusFilter === 'Ikke startet' ? 'selected' : ''}>Ikke startet</option>
                    <option value="Pågår" ${state.statusFilter === 'Pågår' ? 'selected' : ''}>Pågår</option>
                    <option value="Utført / Kontrollert" ${state.statusFilter === 'Utført / Kontrollert' ? 'selected' : ''}>Utført / Kontrollert</option>
                    <option value="missing" ${state.statusFilter === 'missing' ? 'selected' : ''}>Mangler status / Ikke startet</option>
                  </select>

                  <span class="text-xs text-slate-500 tabular-nums pl-1">
                    Viser ${filtered.length} av ${yearAssessments.length}
                  </span>
                </div>
              </div>

              ${
                yearAssessments.length === 0
                  ? `
                    <div class="p-12 text-center max-w-lg mx-auto">
                      <h2 class="text-base font-semibold text-slate-900">
                        Ingen lagrede risikovurderinger for ${escapeHtml(state.selectedYear)}
                      </h2>
                      <p class="mt-2 text-sm text-slate-600 leading-relaxed">
                        ${
                          state.rammeverk.length === 0
                            ? 'Start med å importere Excel-malen eller legge inn sjekkpunkter i rammeverket, og gjennomfør deretter den årlige gjennomgangen.'
                            : 'Rammeverket er klart. Gå til Årlig gjennomgang for å vurdere punktene for dette året.'
                        }
                      </p>
                      <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
                        ${
                          state.rammeverk.length === 0
                            ? `<button type="button" data-tab-btn="framework" class="px-4 py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 transition-colors">Importer rammeverk fra Excel</button>`
                            : `<button type="button" id="start-wizard-for-year-btn" class="px-4 py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 transition-colors">Start årlig gjennomgang for ${escapeHtml(
                                state.selectedYear
                              )}</button>`
                        }
                      </div>
                    </div>
                  `
                  : filtered.length === 0
                  ? `
                    <div class="p-10 text-center">
                      <p class="text-sm font-medium text-slate-900">Ingen punkter matcher søket eller filteret.</p>
                      <button
                        type="button"
                        id="reset-dashboard-filters-btn"
                        class="mt-3 text-xs font-semibold text-blue-700 hover:underline"
                      >
                        Nullstill søk og filtre
                      </button>
                    </div>
                  `
                  : `
                    <div class="overflow-x-auto custom-scroll">
                      <table class="w-full text-left border-collapse">
                        <thead>
                          <tr class="border-b border-slate-200 bg-slate-50/70 text-xs font-semibold text-slate-600">
                            <th class="py-3 px-4 whitespace-nowrap">Nr.</th>
                            <th class="py-3 px-4 min-w-[170px]">Komponent/Sted</th>
                            <th class="py-3 px-4 min-w-[210px]">Farer</th>
                            <th class="py-3 px-4 whitespace-nowrap">Innledende risiko</th>
                            <th class="py-3 px-4 min-w-[240px]">Iverksatte tiltak</th>
                            <th class="py-3 px-4 whitespace-nowrap">Restrisiko</th>
                            <th class="py-3 px-4 min-w-[130px]">Ansvarlig</th>
                            <th class="py-3 px-4 min-w-[180px]">Status</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-sm">
                          ${filtered
                            .map((row) => {
                              const initScore =
                                row.innledendeRisikotall ??
                                computeRisk(
                                  row.innledendeSannsynlighet,
                                  row.innledendeKonsekvens
                                );
                              const restScore =
                                row.restRisikotall ??
                                computeRisk(row.restSannsynlighet, row.restKonsekvens);
                              const rowStatus = row.status || 'Ikke startet';
                              return `
                                <tr
                                  data-edit-assessment-row="${escapeHtml(row.id)}"
                                  class="hover:bg-slate-50/90 cursor-pointer transition-colors align-top"
                                  title="Klikk for å redigere tiltak, ansvarlig eller risikovurdering"
                                >
                                  <td class="py-3 px-4 font-mono tabular-nums text-xs font-semibold text-slate-700 whitespace-nowrap">
                                    ${escapeHtml(row.nr)}
                                  </td>
                                  <td class="py-3 px-4 font-medium text-slate-900">
                                    ${escapeHtml(row.komponentSted || '–')}
                                  </td>
                                  <td class="py-3 px-4 text-slate-700">
                                    <div class="line-clamp-3">${escapeHtml(row.farer || '–')}</div>
                                  </td>
                                  <td class="py-3 px-4 whitespace-nowrap">
                                    ${renderRiskCell(initScore)}
                                  </td>
                                  <td class="py-3 px-4 text-slate-700">
                                    <div class="line-clamp-3">${escapeHtml(row.tiltak || 'Ikke registrert')}</div>
                                  </td>
                                  <td class="py-3 px-4 whitespace-nowrap">
                                    ${renderRiskCell(restScore)}
                                  </td>
                                  <td class="py-3 px-4 text-slate-700">
                                    ${escapeHtml(row.ansvarlig || 'Ikke tildelt')}
                                  </td>
                                  <td class="py-3 px-4" data-stop-row-click="true">
                                    <select
                                      data-status-select="${escapeHtml(row.id)}"
                                      aria-label="Status for punkt ${escapeHtml(row.nr)}"
                                      class="w-full rounded-md border border-slate-300 bg-white px-2.5 py-1.5 text-xs font-medium text-slate-800 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                                    >
                                      ${STATUS_OPTIONS.map(
                                        (opt) =>
                                          `<option value="${escapeHtml(opt)}" ${
                                            rowStatus === opt ? 'selected' : ''
                                          }>${escapeHtml(opt)}</option>`
                                      ).join('')}
                                    </select>
                                  </td>
                                </tr>
                              `;
                            })
                            .join('')}
                        </tbody>
                      </table>
                    </div>
                  `
              }
            </div>
          </section>
        `;
      }

      // ------------------------------------------------------------------
      // Tab 3: ÅRLIG GJENNOMGANG (Veiviser)
      // ------------------------------------------------------------------
      function renderRatingPicker(prefix, currentVal, labelsMap) {
        const val = clampRating(currentVal, 1);
        return `
          <div class="grid grid-cols-5 gap-1.5" role="radiogroup">
            ${[1, 2, 3, 4, 5]
              .map((n) => {
                const active = val === n;
                return `
                  <button
                    type="button"
                    data-rating-field="${prefix}"
                    data-rating-value="${n}"
                    title="${escapeHtml(labelsMap[n])}"
                    class="py-2 px-1 rounded-lg border text-sm font-mono tabular-nums font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 ${
                      active
                        ? 'bg-slate-900 text-white border-slate-900'
                        : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'
                    }"
                  >
                    ${n}
                  </button>
                `;
              })
              .join('')}
          </div>
          <p class="mt-1.5 text-xs text-slate-500">${escapeHtml(labelsMap[val])}</p>
        `;
      }

      function renderWizardView() {
        const years = getAvailableYears();
        const items = state.rammeverk;
        const yearAssessments = getAssessmentsForYear(state.wizardYear);
        const assessedMap = new Map();
        yearAssessments.forEach((a) => {
          if (a.rammeverkId) assessedMap.set(a.rammeverkId, a);
          if (a.nr) assessedMap.set(`nr:${String(a.nr).trim()}`, a);
        });

        const completedCount = items.filter(
          (item) =>
            assessedMap.has(item.id) ||
            assessedMap.has(`nr:${String(item.nr ?? '').trim()}`)
        ).length;

        const prevYear = Number(state.wizardYear) - 1;
        const prevYearCount = getAssessmentsForYear(prevYear).length;

        if (items.length === 0) {
          return `
            <section class="space-y-6">
              <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Årlig gjennomgang</h1>
                <p class="mt-1 text-sm text-slate-600">Systematisk gjennomgang av alle punkter fra rammeverket.</p>
              </div>
              <div class="bg-white border border-slate-200 rounded-xl p-12 text-center max-w-xl mx-auto">
                <h2 class="text-base font-semibold text-slate-900">Rammeverket er tomt</h2>
                <p class="mt-2 text-sm text-slate-600">
                  For å gjennomføre en årlig risikovurdering må det først finnes sjekkpunkter i samlingen «rammeverk». Importer klubbens Excel-fil eller legg til punkter manuelt.
                </p>
                <button
                  type="button"
                  data-tab-btn="framework"
                  class="mt-5 px-4 py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 transition-colors"
                >
                  Gå til Rammeverk &amp; Import
                </button>
              </div>
            </section>
          `;
        }

        const activeItem = items[state.wizardSelectedIndex] || items[0];
        const draft = state.wizardDraft || buildWizardDraft(activeItem, state.wizardYear);
        const initScore = computeRisk(
          draft.innledendeSannsynlighet,
          draft.innledendeKonsekvens
        );
        const restScore = computeRisk(draft.restSannsynlighet, draft.restKonsekvens);
        const isLast = state.wizardSelectedIndex >= items.length - 1;
        const isFirst = state.wizardSelectedIndex <= 0;

        return `
          <section class="space-y-6">
            <!-- Header & Year Picker -->
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Årlig gjennomgang</h1>
                <p class="mt-1 text-sm text-slate-600">
                  Gå gjennom punktene steg for steg og lagre innledende risiko, tiltak og restrisiko for ${escapeHtml(
                    state.wizardYear
                  )}.
                </p>
              </div>

              <div class="flex flex-wrap items-center gap-3">
                <span class="text-xs font-medium text-slate-600 tabular-nums">
                  Fremdrift: <strong class="text-slate-900">${completedCount}</strong> av <strong class="text-slate-900">${items.length}</strong> vurdert
                </span>

                <div class="flex items-center gap-2">
                  <label for="wizard-year-select" class="text-sm font-medium text-slate-700">År:</label>
                  <select
                    id="wizard-year-select"
                    class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-mono tabular-nums font-medium text-slate-900 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                  >
                    ${years
                      .map(
                        (y) =>
                          `<option value="${y}" ${
                            Number(state.wizardYear) === y ? 'selected' : ''
                          }>${y}</option>`
                      )
                      .join('')}
                  </select>
                </div>

                ${
                  prevYearCount > 0
                    ? `
                      <button
                        type="button"
                        id="wizard-copy-prev-btn"
                        class="px-3.5 py-2 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors whitespace-nowrap"
                        title="Hent verdier for dette punktet fra ${prevYear}"
                      >
                        Hent dette punktet fra ${prevYear}
                      </button>
                    `
                    : ''
                }
              </div>
            </div>

            <!-- 2-Column Wizard Workspace -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <!-- Left Sidebar: Checklist Navigation -->
              <aside class="lg:col-span-4 xl:col-span-3 bg-white border border-slate-200 rounded-xl overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                  <span class="text-xs font-semibold text-slate-700">Sjekkpunkter (${items.length})</span>
                  <span class="text-xs text-slate-500 tabular-nums">${Math.round(
                    (completedCount / items.length) * 100
                  )}%</span>
                </div>
                <div class="max-h-[640px] overflow-y-auto custom-scroll divide-y divide-slate-100">
                  ${items
                    .map((item, idx) => {
                      const saved =
                        assessedMap.get(item.id) ||
                        assessedMap.get(`nr:${String(item.nr ?? '').trim()}`);
                      const isActive = idx === state.wizardSelectedIndex;
                      const savedScore = saved
                        ? saved.restRisikotall ??
                          computeRisk(saved.restSannsynlighet, saved.restKonsekvens)
                        : null;
                      const meta = savedScore ? getRiskMeta(savedScore) : null;

                      return `
                        <button
                          type="button"
                          data-wizard-select-index="${idx}"
                          class="w-full text-left px-4 py-3 flex items-start justify-between gap-2.5 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-600 ${
                            isActive ? 'bg-blue-50/70' : 'hover:bg-slate-50'
                          }"
                        >
                          <div class="min-w-0">
                            <div class="flex items-center gap-2 text-xs">
                              <span class="font-mono tabular-nums font-semibold ${
                                isActive ? 'text-blue-800' : 'text-slate-600'
                              }">${escapeHtml(item.nr)}</span>
                              <span aria-hidden="true" class="text-slate-300">·</span>
                              <span class="truncate font-medium ${
                                isActive ? 'text-blue-900' : 'text-slate-900'
                              }">${escapeHtml(item.komponentSted || 'Uten navn')}</span>
                            </div>
                            <p class="mt-0.5 text-xs text-slate-500 truncate">${escapeHtml(
                              item.farer || ''
                            )}</p>
                          </div>
                          <div class="shrink-0 pt-0.5">
                            ${
                              meta
                                ? `<span class="inline-block rounded border px-1.5 py-0.5 text-[11px] font-mono tabular-nums font-semibold ${meta.bgClass}">${savedScore}</span>`
                                : `<span class="text-[11px] text-slate-400">Ikke vurdert</span>`
                            }
                          </div>
                        </button>
                      `;
                    })
                    .join('')}
                </div>
              </aside>

              <!-- Right Main Form -->
              <div class="lg:col-span-8 xl:col-span-9 bg-white border border-slate-200 rounded-xl p-6 space-y-6">
                <!-- Framework Base Details -->
                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 pb-5 border-b border-slate-200">
                  <div>
                    <div class="flex items-center gap-2 text-xs text-slate-500">
                      <span class="font-mono tabular-nums font-semibold text-slate-700">Punkt ${escapeHtml(
                        draft.nr
                      )}</span>
                      <span aria-hidden="true">·</span>
                      <span>Steg ${state.wizardSelectedIndex + 1} av ${items.length}</span>
                      <span aria-hidden="true">·</span>
                      <span>${draft.isSaved ? 'Lagret for ' + escapeHtml(state.wizardYear) : 'Ikke vurdert for ' + escapeHtml(state.wizardYear)}</span>
                    </div>
                    <h2 class="mt-1.5 text-xl font-bold text-slate-900">
                      ${escapeHtml(draft.komponentSted || 'Komponent / Sted')}
                    </h2>
                  </div>
                </div>

                <!-- Master Info Grid -->
                <div class="bg-slate-50 rounded-lg p-4 grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                  <div>
                    <span class="block text-xs font-medium text-slate-500 mb-1">Farer</span>
                    <p class="text-slate-900 leading-relaxed">${escapeHtml(draft.farer || 'Ikke angitt')}</p>
                  </div>
                  <div>
                    <span class="block text-xs font-medium text-slate-500 mb-1">Mulige årsaker</span>
                    <p class="text-slate-800 leading-relaxed">${escapeHtml(
                      draft.muligeArsaker || 'Ikke angitt'
                    )}</p>
                  </div>
                  <div>
                    <span class="block text-xs font-medium text-slate-500 mb-1">Type skade/hendelse</span>
                    <p class="text-slate-800 leading-relaxed">${escapeHtml(
                      draft.typeSkade || 'Ikke angitt'
                    )}</p>
                  </div>
                </div>

                <!-- Innledende Risiko -->
                <div class="space-y-4">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <h3 class="text-sm font-semibold text-slate-900">1. Innledende risiko (før nye tiltak)</h3>
                      <p class="text-xs text-slate-500">Vurder sannsynlighet og konsekvens uten ekstra tiltak.</p>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-slate-500">Innledende risikotall:</span>
                      ${renderRiskCell(initScore)}
                    </div>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1.5">
                        Innledende sannsynlighet (1–5)
                      </label>
                      ${renderRatingPicker(
                        'innledendeSannsynlighet',
                        draft.innledendeSannsynlighet,
                        PROBABILITY_LABELS
                      )}
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1.5">
                        Innledende konsekvens (1–5)
                      </label>
                      ${renderRatingPicker(
                        'innledendeKonsekvens',
                        draft.innledendeKonsekvens,
                        CONSEQUENCE_LABELS
                      )}
                    </div>
                  </div>
                </div>

                <!-- Iverksatte tiltak -->
                <div class="pt-4 border-t border-slate-100 space-y-2">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <label for="wizard-tiltak-input" class="block text-sm font-semibold text-slate-900">
                      2. Iverksatte tiltak for eliminering av risiko
                    </label>
                    <button
                      type="button"
                      id="wizard-ai-suggest-btn"
                      ${state.aiSuggesting ? 'disabled' : ''}
                      class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-60 transition-colors"
                    >
                      ${state.aiSuggesting ? 'Genererer forslag…' : 'Foreslå tiltak med KI'}
                    </button>
                  </div>
                  <textarea
                    id="wizard-tiltak-input"
                    rows="4"
                    placeholder="Beskriv konkrete fysiske, tekniske eller organisatoriske tiltak…"
                    class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                  >${escapeHtml(draft.tiltak)}</textarea>
                </div>

                <!-- Restrisiko -->
                <div class="pt-4 border-t border-slate-100 space-y-4">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <h3 class="text-sm font-semibold text-slate-900">3. Restrisiko (etter tiltak)</h3>
                      <p class="text-xs text-slate-500">Vurder gjenværende risiko når iverksatte tiltak er på plass.</p>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-slate-500">Restrisikotall:</span>
                      ${renderRiskCell(restScore)}
                    </div>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1.5">
                        Restrisiko sannsynlighet (1–5)
                      </label>
                      ${renderRatingPicker(
                        'restSannsynlighet',
                        draft.restSannsynlighet,
                        PROBABILITY_LABELS
                      )}
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1.5">
                        Restrisiko konsekvens (1–5)
                      </label>
                      ${renderRatingPicker(
                        'restKonsekvens',
                        draft.restKonsekvens,
                        CONSEQUENCE_LABELS
                      )}
                    </div>
                  </div>
                </div>

                <!-- Ansvarlig & Status -->
                <div class="pt-4 border-t border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label for="wizard-ansvarlig-input" class="block text-xs font-medium text-slate-700 mb-1.5">
                      Ansvarlig for oppfyllelse av krav
                    </label>
                    <input
                      id="wizard-ansvarlig-input"
                      type="text"
                      list="role-suggestions-list"
                      value="${escapeHtml(draft.ansvarlig)}"
                      placeholder="F.eks. Heisfører, Tråkkemaskinfører, Driftsleder"
                      class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                    />
                  </div>

                  <div>
                    <label for="wizard-status-select" class="block text-xs font-medium text-slate-700 mb-1.5">
                      Tiltaksstatus
                    </label>
                    <select
                      id="wizard-status-select"
                      class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-sm text-slate-900 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                    >
                      ${STATUS_OPTIONS.map(
                        (opt) =>
                          `<option value="${escapeHtml(opt)}" ${
                            draft.status === opt ? 'selected' : ''
                          }>${escapeHtml(opt)}</option>`
                      ).join('')}
                    </select>
                  </div>

      function renderMatrixLegendGrid() {

        return `
          <div class="overflow-x-auto">
            <table class="border-collapse text-center text-xs font-mono tabular-nums">

                  <th class="p-1.5 text-slate-500 font-sans font-medium text-left">S \\ K</th>

                    .map(
                      (c) =>
                        `<th class="p-1.5 w-10 text-slate-600 font-semibold border border-slate-200 bg-slate-50">${c}</th>`
                    )
                    .join('')}
                </tr>
              </thead>
              <tbody>
                ${rows
                  .map(
                    (s) => `
                      <tr>
                        <th class="p-1.5 text-slate-600 font-semibold border border-slate-200 bg-slate-50 text-center w-10">${s}</th>
                        ${cols
                          .map((k) => {
                            const val = s * k;
                            const meta = getRiskMeta(val);
                            return `<td class="p-1.5 w-10 font-semibold border ${meta.bgClass}">${val}</td>`;
                          })
                          .join('')}
                      </tr>
                    `
                  )
                  .join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderReportingView() {
        const years = getAvailableYears();
        const rows = getAssessmentsForYear(state.reportYear);

        let highCount = 0;
        let mediumCount = 0;
        let lowCount = 0;
        let doneCount = 0;

        rows.forEach((r) => {
          const rest = r.restRisikotall ?? computeRisk(r.restSannsynlighet, r.restKonsekvens);
          const meta = getRiskMeta(rest);
          if (meta.key === 'high') highCount++;
          else if (meta.key === 'medium') mediumCount++;
          else lowCount++;
          if (r.status === 'Utført / Kontrollert') doneCount++;
        });

        const todayFormatted = new Intl.DateTimeFormat('nb-NO', {
          dateStyle: 'long',

        return `
