      function render() {
        const root = document.getElementById('app');
        if (!root) return;

        let mainContent = '';
        if (state.dataLoading) {
          mainContent = `
            <div class="py-16 text-center space-y-3">
              <div class="inline-block h-7 w-7 animate-spin rounded-full border-2 border-slate-300 border-t-blue-700"></div>
              <p class="text-sm text-slate-500">Henter data fra Firestore…</p>
            </div>
          `;
        } else if (!state.permissionDenied) {
          switch (state.activeTab) {
            case 'wizard':
              mainContent = renderWizardView();
              break;
            case 'framework':
              mainContent = renderFrameworkView();
              break;
            case 'reporting':
              mainContent = renderReportingView();
              break;
            case 'dashboard':
            default:
              mainContent = renderDashboardView();
              break;
          }
        }

        root.innerHTML = `
          ${renderTopHeader()}
          <main class="flex-1 w-full max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
            ${
              state.permissionDenied
                ? renderPermissionHelpCard()
                : state.dataError
                ? `<div class="print-hidden mb-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">${escapeHtml(
                    state.dataError
                  )}</div>`
                : ''
            }
            ${mainContent}
          </main>
          <footer class="print-hidden border-t border-slate-200 bg-white mt-auto">
            <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
              <span>Hvittingsfoss Alpinklubb · Risikoanalyse &amp; SJA</span>
              <span>Risikotall = Sannsynlighet (1–5) × Konsekvens (1–5)</span>
            </div>
          </footer>
        `;

        bindWorkspaceEvents();
        renderModals();
      }

      // ------------------------------------------------------------------
      // 12. Event Listeners
      // ------------------------------------------------------------------
      function bindWorkspaceEvents() {
        // Permission recovery actions (if Firestore rules block unauthenticated access)
        document.getElementById('retry-firestore-btn')?.addEventListener('click', () => {
          startFirestoreListeners();
          render();
        });

        document
          .getElementById('copy-firestore-rules-btn')
          ?.addEventListener('click', async () => {
            const snippet = `rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /rammeverk/{doc} {\n      allow read, write: if true;\n    }\n    match /vurderinger/{doc} {\n      allow read, write: if true;\n    }\n  }\n}`;
            try {
              await navigator.clipboard.writeText(snippet);
              showToast('Firestore-regler kopiert til utklippstavlen.');
            } catch {
              showToast('Kunne ikke kopiere automatisk.', 'info');
            }
          });

        document.getElementById('open-optional-auth-btn')?.addEventListener('click', () => {
          state.showOptionalAuthForm = true;
          state.optionalAuthError = '';
          render();
        });

        document
          .getElementById('cancel-optional-auth-btn')
          ?.addEventListener('click', () => {
            state.showOptionalAuthForm = false;
            state.optionalAuthError = '';
            render();
          });

        document
          .getElementById('optional-auth-form')
          ?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('opt-auth-email')?.value.trim() || '';
            const password = document.getElementById('opt-auth-password')?.value || '';
            if (!email || !password) return;

            state.optionalAuthSubmitting = true;
            state.optionalAuthError = '';
            render();

            try {
              await signInWithEmailAndPassword(auth, email, password);
              state.showOptionalAuthForm = false;
              state.permissionDenied = false;
              state.dataError = '';
              startFirestoreListeners();
            } catch (err) {
              console.warn('Optional auth failed:', err);
              state.optionalAuthError =
                'Feil e-post eller passord for prosjektet risikoanalyse-c5838.';
            } finally {
              state.optionalAuthSubmitting = false;
              render();
            }
          });

        // Tab navigation
        document.querySelectorAll('[data-tab-btn], [data-tab-link]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const tab = btn.dataset.tabBtn || btn.dataset.tabLink;
            if (tab) {
              state.activeTab = tab;
              if (tab === 'wizard') syncWizardDraft(true);
              render();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          });
        });

        // ---------------- Dashboard Events ----------------
        document.getElementById('dashboard-year-select')?.addEventListener('change', (e) => {
          state.selectedYear = parseInt(e.target.value, 10) || CURRENT_YEAR;
          render();
        });

        document.getElementById('dashboard-search-input')?.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          const cursorPos = e.target.selectionStart;
          render();
          const input = document.getElementById('dashboard-search-input');
          if (input) {
            input.focus();
            input.setSelectionRange(cursorPos, cursorPos);
          }
        });

        document.getElementById('dashboard-risk-filter')?.addEventListener('change', (e) => {
          state.riskFilter = e.target.value;
          render();
        });

        document.getElementById('dashboard-status-filter')?.addEventListener('change', (e) => {
          state.statusFilter = e.target.value;
          render();
        });

        document.getElementById('reset-dashboard-filters-btn')?.addEventListener('click', () => {
          state.searchQuery = '';
          state.riskFilter = 'all';
          state.statusFilter = 'all';
          render();
        });

        document.getElementById('start-wizard-for-year-btn')?.addEventListener('click', () => {
          state.wizardYear = state.selectedYear;
          state.activeTab = 'wizard';
          syncWizardDraft(false);
          render();
        });

        // Inline status dropdown in table
        document.querySelectorAll('[data-status-select]').forEach((sel) => {
          sel.addEventListener('click', (e) => e.stopPropagation());
          sel.addEventListener('change', (e) => {
            e.stopPropagation();
            const docId = sel.dataset.statusSelect;
            saveAssessmentStatus(docId, e.target.value);
          });
        });

        // Click table row to edit assessment
        document.querySelectorAll('[data-edit-assessment-row]').forEach((rowEl) => {
          rowEl.addEventListener('click', (e) => {
            if (e.target.closest('[data-stop-row-click]')) return;
            const docId = rowEl.dataset.editAssessmentRow;
            const found = state.vurderinger.find((v) => v.id === docId);
            if (found) {
              state.editingAssessmentId = docId;
              state.editingAssessmentDraft = { ...found };
              renderModals();
            }
          });
        });

        // ---------------- Wizard Events ----------------
        document.getElementById('wizard-year-select')?.addEventListener('change', (e) => {
          state.wizardYear = parseInt(e.target.value, 10) || CURRENT_YEAR;
          syncWizardDraft(false);
          render();
        });

        document.querySelectorAll('[data-wizard-select-index]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.wizardSelectedIndex = parseInt(btn.dataset.wizardSelectIndex, 10) || 0;
            syncWizardDraft(false);
            render();
          });
        });

        document.querySelectorAll('[data-rating-field]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (!state.wizardDraft) return;
            const field = btn.dataset.ratingField;
            const val = parseInt(btn.dataset.ratingValue, 10);
            state.wizardDraft[field] = clampRating(val, 1);
            render();
          });
        });

        document.getElementById('wizard-tiltak-input')?.addEventListener('input', (e) => {
          if (state.wizardDraft) state.wizardDraft.tiltak = e.target.value;
        });

        document.getElementById('wizard-ansvarlig-input')?.addEventListener('input', (e) => {
          if (state.wizardDraft) state.wizardDraft.ansvarlig = e.target.value;
        });

        document.getElementById('wizard-status-select')?.addEventListener('change', (e) => {
          if (state.wizardDraft) state.wizardDraft.status = e.target.value;
        });

        document.getElementById('wizard-copy-prev-btn')?.addEventListener('click', () => {
          if (!state.wizardDraft || !state.rammeverk[state.wizardSelectedIndex]) return;
          const prevYear = Number(state.wizardYear) - 1;
          const activeItem = state.rammeverk[state.wizardSelectedIndex];
          const prev = findAssessmentForCheckpoint(prevYear, activeItem);
          if (!prev) {
            showToast(`Fant ingen vurdering for dette punktet i ${prevYear}.`, 'info');
            return;
          }
          state.wizardDraft.innledendeSannsynlighet = clampRating(
            prev.innledendeSannsynlighet,
            2
          );
          state.wizardDraft.innledendeKonsekvens = clampRating(
            prev.innledendeKonsekvens,
            3
          );
          state.wizardDraft.tiltak = prev.tiltak ?? state.wizardDraft.tiltak;
          state.wizardDraft.restSannsynlighet = clampRating(prev.restSannsynlighet, 1);
          state.wizardDraft.restKonsekvens = clampRating(prev.restKonsekvens, 2);
          state.wizardDraft.ansvarlig = prev.ansvarlig ?? state.wizardDraft.ansvarlig;
          render();
          showToast(`Hentet verdier fra ${prevYear}.`);
        });

        document.getElementById('wizard-ai-suggest-btn')?.addEventListener('click', async () => {
          if (!state.wizardDraft) return;
          state.aiSuggesting = true;
          render();
          try {
            const suggestion = await requestGeminiSuggestion(state.wizardDraft);
            if (suggestion) {
              const current = (state.wizardDraft.tiltak || '').trim();
              state.wizardDraft.tiltak = current
                ? `${current}\n\nKI-forslag:\n${suggestion}`
                : suggestion;
              showToast('KI-forslag lagt inn i tiltaksfeltet.');
            }
          } catch (err) {
            console.error(err);
            showToast('Kunne ikke hente forslag fra Gemini API. Sjekk API-nøkkelen.', 'error');
          } finally {
            state.aiSuggesting = false;
            render();
          }
        });

        document.getElementById('wizard-prev-btn')?.addEventListener('click', () => {
          if (state.wizardSelectedIndex > 0) {
            state.wizardSelectedIndex -= 1;
            syncWizardDraft(false);
            render();
          }
        });

        const handleWizardSave = async (advanceNext) => {
          if (!state.wizardDraft) return;
          state.wizardSaving = true;
          render();
          try {
            const docId =
              state.wizardDraft.id ||
              makeDocId(
                state.wizardYear,
                state.wizardDraft.rammeverkId,
                state.wizardDraft.nr
              );
            await saveAssessmentRecord(
              {
                ...state.wizardDraft,
                arstall: state.wizardYear,
              },
              docId
            );
            state.wizardDraft.isSaved = true;
            state.selectedYear = Number(state.wizardYear);

            if (advanceNext && state.wizardSelectedIndex < state.rammeverk.length - 1) {
              state.wizardSelectedIndex += 1;
              syncWizardDraft(false);
              showToast('Lagret! Gikk til neste punkt.');
            } else {
              showToast(`Punkt ${state.wizardDraft.nr} lagret for ${state.wizardYear}.`);
            }
          } catch (err) {
            console.error(err);
            showToast(translateFirestoreError(err), 'error');
          } finally {
            state.wizardSaving = false;
            render();
          }
        };

        document
          .getElementById('wizard-save-only-btn')
          ?.addEventListener('click', () => handleWizardSave(false));
        document
          .getElementById('wizard-save-next-btn')
          ?.addEventListener('click', () => handleWizardSave(true));

        // ---------------- Framework & Import Events ----------------
        document.getElementById('framework-search-input')?.addEventListener('input', (e) => {
          state.frameworkSearch = e.target.value;
          const cursorPos = e.target.selectionStart;
          render();
          const input = document.getElementById('framework-search-input');
          if (input) {
            input.focus();
            input.setSelectionRange(cursorPos, cursorPos);
          }
        });

        document.getElementById('new-framework-item-btn')?.addEventListener('click', () => {
          const nextNum = String(state.rammeverk.length + 1);
          state.editingFrameworkItem = {
            isNew: true,
            nr: nextNum,
            komponentSted: '',
            farer: '',
            muligeArsaker: '',
            typeSkade: '',
            standardTiltak: '',
            standardAnsvarlig: '',
          };
          renderModals();
        });

        document.querySelectorAll('[data-edit-framework]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const item = state.rammeverk.find((x) => x.id === btn.dataset.editFramework);
            if (item) {
              state.editingFrameworkItem = { ...item, isNew: false };
              renderModals();
            }
          });
        });

        document.querySelectorAll('[data-delete-framework]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.deleteFramework;
            const item = state.rammeverk.find((x) => x.id === id);
            if (!item) return;
            if (btn.dataset.confirmDelete !== 'true') {
              btn.dataset.confirmDelete = 'true';
              btn.textContent = 'Bekreft slett?';
              btn.classList.add('font-bold');
              setTimeout(() => {
                if (btn.isConnected) {
                  btn.dataset.confirmDelete = 'false';
                  btn.textContent = 'Slett';
                  btn.classList.remove('font-bold');
                }
              }, 3500);
              return;
            }
            try {
              await deleteFrameworkItem(id);
              showToast(`Punkt ${item.nr} slettet fra rammeverket.`);
            } catch (err) {
              console.error(err);
              showToast(translateFirestoreError(err), 'error');
            }
          });
        });

        // Excel File Input
        const fileInput = document.getElementById('excel-file-input');
        if (fileInput) {
          fileInput.addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            state.importError = '';
            try {
              const buffer = await file.arrayBuffer();
              const workbook = XLSX.read(buffer, { type: 'array' });
              const parsed = parseExcelWorksheet(workbook);
              state.importPreview = {
                ...parsed,
                fileName: file.name,
                workbook,
              };
            } catch (err) {
              console.error('Excel parse error:', err);
              state.importPreview = null;
              state.importError = err?.message || 'Kunne ikke lese filen.';
            } finally {
              e.target.value = '';
              render();
            }
          });
        }

        document.getElementById('import-sheet-select')?.addEventListener('change', (e) => {
          if (!state.importPreview?.workbook) return;
          try {
            const parsed = parseExcelWorksheet(
              state.importPreview.workbook,
              e.target.value
            );
            state.importPreview = {
              ...parsed,
              fileName: state.importPreview.fileName,
              workbook: state.importPreview.workbook,
            };
            state.importError = '';
          } catch (err) {
            state.importError = err?.message || 'Kunne ikke lese valgt regneark.';
          }
          render();
        });

        document.getElementById('cancel-import-btn')?.addEventListener('click', () => {
          state.importPreview = null;
          state.importError = '';
          render();
        });

        document.getElementById('import-history-checkbox')?.addEventListener('change', (e) => {
          state.importIncludeHistory = e.target.checked;
          render();
        });

        document.getElementById('import-history-year')?.addEventListener('input', (e) => {
          state.importHistoryYear = parseInt(e.target.value, 10) || 2025;
        });

        document.getElementById('commit-import-btn')?.addEventListener('click', () => {
          commitExcelImport();
        });

        // ---------------- Reporting & Export Events ----------------
        document.getElementById('report-year-select')?.addEventListener('change', (e) => {
          state.reportYear = parseInt(e.target.value, 10) || CURRENT_YEAR;
          render();
        });

        document.getElementById('export-xlsx-btn')?.addEventListener('click', () => {
          exportYearAssessments(state.reportYear, 'xlsx');
        });

        document.getElementById('export-csv-btn')?.addEventListener('click', () => {
          exportYearAssessments(state.reportYear, 'csv');
        });

        document.getElementById('print-report-btn')?.addEventListener('click', () => {
          window.print();
        });

        document
          .getElementById('toggle-gemini-visibility-btn')
          ?.addEventListener('click', () => {
            state.geminiKeyVisible = !state.geminiKeyVisible;
            render();
          });

        document.getElementById('gemini-key-form')?.addEventListener('submit', (e) => {
          e.preventDefault();
          const val = document.getElementById('gemini-key-input')?.value.trim() || '';
          state.geminiKey = val;
          if (val) {
            localStorage.setItem(GEMINI_KEY_STORAGE, val);
            showToast('Gemini API-nøkkel lagret lokalt i nettleseren.');
          } else {
            localStorage.removeItem(GEMINI_KEY_STORAGE);
            showToast('Gemini API-nøkkel fjernet.', 'info');
          }
          render();
        });

        document.getElementById('clear-gemini-key-btn')?.addEventListener('click', () => {
          state.geminiKey = '';
          localStorage.removeItem(GEMINI_KEY_STORAGE);
          showToast('Gemini API-nøkkel fjernet.', 'info');
          render();
        });
      }

      function bindAssessmentModalEvents() {
        const close = () => {
          state.editingAssessmentId = null;
          state.editingAssessmentDraft = null;
          renderModals();
        };

        document
          .getElementById('close-assessment-modal-btn')
          ?.addEventListener('click', close);
        document
          .getElementById('cancel-assessment-modal-btn')
          ?.addEventListener('click', close);

        const syncModalSelects = () => {
          const d = state.editingAssessmentDraft;
          if (!d) return;
          d.tiltak = document.getElementById('modal-tiltak')?.value ?? d.tiltak;
          d.ansvarlig = document.getElementById('modal-ansvarlig')?.value ?? d.ansvarlig;
          d.status = document.getElementById('modal-status')?.value ?? d.status;
          d.merknad = document.getElementById('modal-merknad')?.value ?? d.merknad;
          d.innledendeSannsynlighet = clampRating(
            document.getElementById('modal-init-s')?.value,
            d.innledendeSannsynlighet
          );
          d.innledendeKonsekvens = clampRating(
            document.getElementById('modal-init-k')?.value,
            d.innledendeKonsekvens
          );
          d.restSannsynlighet = clampRating(
            document.getElementById('modal-rest-s')?.value,
            d.restSannsynlighet
          );
          d.restKonsekvens = clampRating(
            document.getElementById('modal-rest-k')?.value,
            d.restKonsekvens
          );
        };

        ['modal-init-s', 'modal-init-k', 'modal-rest-s', 'modal-rest-k'].forEach((id) => {
          document.getElementById(id)?.addEventListener('change', () => {
            syncModalSelects();
            renderModals();
          });
        });

        document.getElementById('modal-ai-suggest-btn')?.addEventListener('click', async () => {
          syncModalSelects();
          const d = state.editingAssessmentDraft;
          if (!d) return;
          state.aiSuggesting = true;
          renderModals();
          try {
            const suggestion = await requestGeminiSuggestion(d);
            if (suggestion) {
              const current = (d.tiltak || '').trim();
              d.tiltak = current ? `${current}\n\nKI-forslag:\n${suggestion}` : suggestion;
              showToast('KI-forslag lagt inn.');
            }
          } catch (err) {
            console.error(err);
            showToast('Kunne ikke hente forslag fra Gemini API. Sjekk nøkkelen.', 'error');
          } finally {
            state.aiSuggesting = false;
            renderModals();
          }
        });

        document
          .getElementById('assessment-modal-form')
          ?.addEventListener('submit', async (e) => {
            e.preventDefault();
            syncModalSelects();
            const d = state.editingAssessmentDraft;
            const docId = state.editingAssessmentId;
            if (!d || !docId) return;

            try {
              await saveAssessmentRecord(d, docId);
              showToast(`Endringer lagret for punkt ${d.nr}.`);
              close();
            } catch (err) {
              console.error(err);
              showToast(translateFirestoreError(err), 'error');
            }
          });
      }

      function bindFrameworkModalEvents() {
        const close = () => {
          state.editingFrameworkItem = null;
          renderModals();
        };

        document.getElementById('close-fw-modal-btn')?.addEventListener('click', close);
        document.getElementById('cancel-fw-modal-btn')?.addEventListener('click', close);

        document.getElementById('fw-modal-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const fw = state.editingFrameworkItem;
          if (!fw) return;

          const payload = {
            nr: document.getElementById('fw-nr')?.value.trim() || '',
            komponentSted: document.getElementById('fw-komponent')?.value.trim() || '',
            farer: document.getElementById('fw-farer')?.value.trim() || '',
            muligeArsaker: document.getElementById('fw-arsaker')?.value.trim() || '',
            typeSkade: document.getElementById('fw-skade')?.value.trim() || '',
            standardTiltak: document.getElementById('fw-tiltak')?.value.trim() || '',
            standardAnsvarlig: document.getElementById('fw-ansvarlig')?.value.trim() || '',
          };

          try {
            await saveFrameworkItem(payload, fw.isNew ? null : fw.id);
            showToast(
              fw.isNew
                ? `Nytt punkt ${payload.nr} lagt til i rammeverket.`
                : `Punkt ${payload.nr} oppdatert.`
            );
            close();
          } catch (err) {
            console.error(err);
            showToast(translateFirestoreError(err), 'error');
          }
        });
      }

      // ------------------------------------------------------------------
      // 13. Start module directly without login screen
      //     (reuses cached auth session or attempts silent anonymous auth)
      // ------------------------------------------------------------------
      let authBootstrapped = false;
      render();

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          authBootstrapped = true;
          startFirestoreListeners();
          return;
        }

        if (!authBootstrapped) {
          authBootstrapped = true;
          try {
            await signInAnonymously(auth);
            // onAuthStateChanged fires with the anonymous user and starts listeners
          } catch (err) {
            // If Anonymous Auth is disabled in Firebase Console, still attempt direct Firestore access
            console.info('Anonymous auth unavailable, trying direct Firestore access:', err?.code);
            startFirestoreListeners();
          }
        }
      });
    </script>
  </body>
</html>
